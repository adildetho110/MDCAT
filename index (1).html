var M=null;
function mock(){var o='<option value="*">All MCQs</option>'+D.sec.map(function(x){return '<option value="s:'+x.id+'">'+esc(path(x.id))+' ('+cnt(x.id)+')</option>'}).join("")+D.papers.map(function(p){return '<option value="p:'+p.id+'">Paper: '+esc(p.t)+'</option>'}).join("");
var h='<h2 class="t">Mock Tests</h2>'+(M&&!M.fin?'<button class="btn" style="width:100%;margin-bottom:12px" onclick="go(\'mockrun\')">Resume running test</button>':"")+'<div class="box" style="--c:#2563eb"><div class="em">📝</div><h3>New test</h3><p>Negative marking: '+D.set.neg+' per wrong answer (change in Settings)</p><div class="mu">Questions from</div><select id="msc">'+o+'</select><div class="mu">Number of MCQs (max 180)</div><input id="mn" type="number" value="180"><div class="mu">Minutes (empty = '+D.set.sec+' seconds per MCQ)</div><input id="mm" type="number" placeholder="Auto"><button class="btn" onclick="mockStart($(\'msc\').value,+$(\'mn\').value,+$(\'mm\').value)">Start test</button></div>';
if(D.mocks.length){h+='<h3>History</h3>';D.mocks.map(function(r,i){return[r,i]}).slice(-10).reverse().forEach(function(p){var r=p[0];h+='<div class="box tap" style="--c:#2563eb" onclick="mockReview('+p[1]+')"><div class="row"><b class="sp">'+r.sc+' / '+r.n+' ('+r.pct+'%)</b><span class="mu">'+fmt(r.t)+'</span></div><p style="margin:4px 0 0">'+r.c+' correct · '+r.w+' wrong · '+r.sk+' skipped. Tap to review.</p></div>'})}
return h}
function mockStart(sc,n,mins){var a=sc.indexOf("s:")===0?ids(sc.slice(2)):[];var p=D.mcq.filter(function(m){if(sc==="*")return 1;if(sc.indexOf("p:")===0)return m.src===sc.slice(2);return a.indexOf(m.sec)>-1});
if(!p.length){alert("No MCQs in that selection.");return}
p.sort(function(){return Math.random()-.5});n=Math.min(n>0?n:180,180,p.length);p=p.slice(0,n);mins=mins>0?mins:Math.max(1,Math.round(n*D.set.sec/60));
clearInterval(window._iv);M={list:p,ans:{},i:0,end:Date.now()+mins*60000,start:Date.now()};window._iv=setInterval(tick,1000);go("mockrun")}
function tick(){if(!M||M.fin){clearInterval(window._iv);return}var r=Math.max(0,Math.round((M.end-Date.now())/1000)),e=$("tm");if(e)e.textContent=pad(r);if(r<=0){mockSubmit(1);alert("Time is up. Your test was submitted.")}}
function mockrun(){if(!M||M.fin)return mock();var m=M.list[M.i],r=Math.max(0,Math.round((M.end-Date.now())/1000)),an=Object.keys(M.ans).length,ts=secById(topOf(m.sec));
var h='<div class="row" style="margin-bottom:10px"><span class="pill" id="tm" style="--c:#e11d48">'+pad(r)+'</span><span class="mu sp">Q '+(M.i+1)+' of '+M.list.length+' · answered '+an+'</span></div><div class="box" style="--c:'+(ts?ts.c:"#e6168a")+'"><b>'+esc(m.q)+'</b></div>';
m.o.forEach(function(o,j){h+='<button class="opt'+(M.ans[M.i]===j?" ok":"")+'" onclick="mpick('+j+')">'+"ABCDE"[j]+'. '+esc(o)+'</button>'});
return h+'<div class="row" style="margin-top:6px"><button class="btn g" '+(M.i?"":"disabled")+' onclick="M.i--;render()">Previous</button><button class="btn g" '+(M.i<M.list.length-1?"":"disabled")+' onclick="M.i++;render()">Next</button><span class="sp"></span><button class="btn" onclick="mockSubmit(0)">Submit</button></div>'}
function mpick(j){if(M.ans[M.i]===j)delete M.ans[M.i];else M.ans[M.i]=j;render()}
function mockSubmit(auto){if(!auto&&!confirm("Submit the test now?"))return;clearInterval(window._iv);var c=0,w=0,id=[],an=[];
M.list.forEach(function(m,i){var a=M.ans[i];id.push(m.id);an.push(a===undefined?-1:a);if(a===undefined)return;var ok=a===m.a;ok?c++:w++;D.log.push({id:m.id,sec:m.sec,ok:ok,t:Date.now()})});
var n=M.list.length,sc=Math.round((c-w*D.set.neg)*100)/100,rec={t:Date.now(),n:n,c:c,w:w,sk:n-c-w,sc:sc,pct:Math.max(0,Math.round(sc/n*100)),secs:Math.round((Date.now()-M.start)/1000),ids:id,ans:an};
D.mocks.push(rec);save();M={rec:rec,fin:1};go("mockres")}
function mockReview(i){M={rec:D.mocks[i],fin:1};go("mockres")}
function mockres(){var r=M&&M.rec;if(!r)return mock();
var h='<div class="hero"><h2>'+r.sc+' / '+r.n+'</h2><p>'+r.pct+'% · '+r.c+' correct · '+r.w+' wrong · '+r.sk+' skipped · '+pad(r.secs)+' min</p><button class="btn w" onclick="go(\'mock\')">New test</button></div><h3>Review</h3>';
r.ids.forEach(function(id,i){var m=mcqById(id);if(!m)return;var a=r.ans[i],st=a<0?"skip":a===m.a?"ok":"no";
h+='<div class="box" style="--c:'+(st==="ok"?"#0d9f6e":st==="no"?"#e11d48":"#6e6a80")+'"><b>'+(i+1)+'. '+esc(m.q)+'</b><div class="mu" style="margin-top:6px">Your answer: '+(a<0?"skipped":"ABCDE"[a]+". "+esc(m.o[a]))+'</div><div class="mu">Correct: '+"ABCDE"[m.a]+'. '+esc(m.o[m.a])+'</div>'+(m.e?'<div class="mu">'+esc(m.e)+'</div>':"")+'</div>'});return h}
/* ---------- bookmarks, wrong, revision ---------- */
function bmpage(){var l=D.bm.map(mcqById).filter(Boolean).sort(function(a,b){return path(a.sec)<path(b.sec)?-1:1});
return '<div class="row"><h2 class="t sp">Bookmarks</h2>'+(l.length?'<button class="btn" onclick="start(\'bm\')">Practice</button>':"")+'</div>'+(l.length?l.map(function(m){return '<div class="box" style="--c:#f59e0b"><span class="pill" style="--c:#f59e0b">'+esc(path(m.sec))+'</span><p style="color:inherit;margin:8px 0"><b>'+esc(m.q)+'</b></p><div class="mu">Answer: '+"ABCDE"[m.a]+'. '+esc(m.o[m.a])+'</div>'+(m.e?'<div class="mu">'+esc(m.e)+'</div>':"")+'<button class="btn g s" style="margin-top:8px" onclick="bmk(\''+m.id+'\')">Remove</button></div>'}).join(""):box("#f59e0b","🔖","No bookmarks yet","Tap Bookmark while practising to save a question here.","",0,0))}
function wrong(){var l=D.mcq.filter(function(m){return isWrong(m.id)}).sort(function(a,b){return wc(b.id)-wc(a.id)}),rp=l.filter(function(m){return wc(m.id)>=2}).length;
return '<div class="row"><h2 class="t sp">Wrong Questions</h2>'+(l.length?'<button class="btn" onclick="start(\'wrong\')">Practice</button>':"")+'</div><div class="card mu">'+l.length+' to fix · '+rp+' repeated mistakes · '+D.mast.length+' mastered</div>'+
(l.length?l.map(function(m){return '<div class="box" style="--c:#e11d48"><span class="pill" style="--c:#e11d48">Wrong '+wc(m.id)+'x</span> <span class="mu">'+esc(path(m.sec))+'</span><p style="color:inherit;margin:8px 0"><b>'+esc(m.q)+'</b></p><div class="mu">Answer: '+"ABCDE"[m.a]+'. '+esc(m.o[m.a])+'</div>'+(m.e?'<div class="mu">'+esc(m.e)+'</div>':"")+'<button class="btn g s" style="margin-top:8px" onclick="D.mast.push(\''+m.id+'\');save();render()">Mark mastered</button></div>'}).join(""):box("#e11d48","🎉","Nothing to fix","Wrong answers are saved here automatically.","",0,0))+(D.mast.length?'<button class="btn g s" onclick="D.mast=[];save();render()">Reset mastered</button>':"")}
function revision(){var rv=D.mcq.filter(function(m){return isWrong(m.id)||D.bm.indexOf(m.id)>-1}).length,wk=D.sec.map(function(x){return{s:x,x:stat(x.id)}}).filter(function(o){return o.x.n>=3&&o.x.p<70}).sort(function(a,b){return a.x.p-b.x.p});
var h='<h2 class="t">Revision</h2><div class="hero"><h2>Revise Today</h2><p>'+rv+' MCQs: wrong answers and bookmarks</p><button class="btn w" onclick="start(\'rev\')">Start revision</button></div><div class="g2">'+box("#e11d48","❌","Wrong MCQs","Previous mistakes","","go('wrong')",1)+box("#f59e0b","🔖","Bookmarked","Saved questions",D.bm.length+" SAVED","go('bmpage')",1)+'</div><h3 style="margin-top:16px">Weak sections</h3>';
return h+(wk.length?wk.map(function(o){return '<div class="box" style="--c:'+o.s.c+'"><div class="row"><span class="sp"><b>'+o.s.em+' '+esc(path(o.s.id))+'</b></span><span class="pill">'+o.x.p+'%</span></div><button class="btn g s" style="margin-top:8px" onclick="start(\'s:'+o.s.id+'\')">Revise</button></div>'}).join(""):'<div class="card mu">Sections under 70% accuracy (3+ attempts) show up here.</div>')}
/* ---------- planner, search, settings, AI ---------- */
function planner(){var n=todayN(),g=D.set.goal,mn=D.study[dayKey()]||0,tg=D.set.min,days=[],mx=1;
for(var i=6;i>=0;i--){var d=new Date(Date.now()-i*864e5),k=dayKey(d),c=D.log.filter(function(x){return dayKey(x.t)===k}).length;if(c>mx)mx=c;days.push([d.toLocaleDateString(undefined,{weekday:"short"}),c])}
var h='<h2 class="t">Study Planner</h2><div class="box" style="--c:#e6168a"><b>Daily MCQ target</b><div class="bar"><i style="width:'+Math.min(100,Math.round(n/g*100))+'%;background:#e6168a"></i></div><div class="mu">'+n+' of '+g+' MCQs today (change in Settings)</div></div><div class="box" style="--c:#06b6d4"><b>Daily study time</b><div class="bar"><i style="width:'+Math.min(100,Math.round(mn/tg*100))+'%;background:#06b6d4"></i></div><div class="mu">'+mn+' of '+tg+' minutes today</div><div class="row" style="margin-top:8px"><button class="btn g s" onclick="addMin(15)">+15 min</button><button class="btn g s" onclick="addMin(30)">+30 min</button><button class="btn g s" onclick="addMin(60)">+1 hour</button></div></div><div class="box" style="--c:#2563eb"><b>Last 7 days</b><div style="display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px">'+days.map(function(d){return '<div style="flex:1;text-align:center"><div style="background:var(--ac);height:'+Math.max(3,Math.round(d[1]/mx*56))+'px;border-radius:6px"></div><div class="mu">'+d[0]+'</div></div>'}).join("")+'</div></div>';
var dn=D.todo.filter(function(t){return t.d}).length;
h+='<div class="box" style="--c:#0d9f6e"><b>Chapters and topics</b><div class="mu" style="margin-bottom:8px">'+dn+' done · '+(D.todo.length-dn)+' pending</div><input id="td" placeholder="For example Biology Ch 3, Thursday"><button class="btn s" onclick="addTodo()">Add</button>'+D.todo.map(function(t,i){return '<div class="row" style="margin-top:8px"><button class="btn g s" onclick="D.todo['+i+'].d=!D.todo['+i+'].d;save();render()">'+(t.d?"✅":"⬜")+'</button><span class="sp"'+(t.d?' style="text-decoration:line-through;opacity:.6"':"")+'>'+esc(t.t)+'</span><button class="btn g s" onclick="D.todo.splice('+i+',1);save();render()">✖</button></div>'}).join("")+'</div>';return h}
function addMin(m){var k=dayKey();D.study[k]=(D.study[k]||0)+m;save();render()}
function addTodo(){var t=$("td").value.trim();if(!t)return;D.todo.push({t:t,d:false});save();render()}
function search(){return '<h2 class="t">Search</h2><input id="sq" placeholder="Search MCQs, notes, sections, papers" oninput="window._sq=this.value;$(\'sr\').innerHTML=sres(this.value)" value="'+esc(window._sq||"")+'"><div id="sr">'+sres(window._sq||"")+'</div>'}
function sres(q){q=q.toLowerCase().trim();if(q.length<2)return '<div class="mu">Type at least 2 letters.</div>';var h='',has=function(x){return String(x).toLowerCase().indexOf(q)>-1};
D.sec.filter(function(x){return has(x.name)}).slice(0,8).forEach(function(x){h+='<div class="card tap" style="cursor:pointer" onclick="'+gp(x.id)+'">'+x.em+' <b>'+esc(path(x.id))+'</b> <span class="mu">section</span></div>'});
D.notes.filter(function(n){return has(n.title+" "+n.body)}).slice(0,8).forEach(function(n){h+='<div class="card" style="cursor:pointer" onclick="go(\'note\',\''+n.id+'\')">📝 <b>'+esc(n.title)+'</b> <span class="mu">note</span></div>'});
D.papers.filter(function(p){return has(p.t)}).forEach(function(p){h+='<div class="card" style="cursor:pointer" onclick="go(\'papers\')">📋 <b>'+esc(p.t)+'</b> <span class="mu">paper</span></div>'});
D.mcq.filter(function(m){return has(m.q+" "+m.o.join(" ")+" "+(m.e||""))}).slice(0,25).forEach(function(m){h+='<div class="card"><div class="mu">'+esc(path(m.sec))+'</div><b>'+esc(m.q)+'</b><div class="mu">Answer: '+"ABCDE"[m.a]+'. '+esc(m.o[m.a])+'</div></div>'});
return h||'<div class="mu">Nothing found.</div>'}
function settings(){var s=D.set;function sel(id,v,c){return '<select id="'+id+'" onchange="setS()">'+v.map(function(x){return '<option'+(String(x)===String(c)?" selected":"")+'>'+x+'</option>'}).join("")+'</select>'}
return '<h2 class="t">Settings</h2><div class="box" style="--c:#7c3aed"><div class="mu">Negative marking per wrong answer (mock tests)</div>'+sel("sn2",[0,0.25,0.5,1],s.neg)+'<div class="mu">Mock test seconds per MCQ</div>'+sel("ss",[30,45,60,72,90],s.sec)+'<div class="mu">Daily MCQ target</div>'+sel("sg",[10,20,30,50,100,150,200],s.goal)+'<div class="mu">Daily study minutes target</div>'+sel("sm",[30,60,90,120,180,240,300],s.min)+'<div class="mu">Practice difficulty</div>'+sel("sd",["All","Easy","Medium","Hard"],s.diff)+'<div class="mu">AI answers</div><select id="so" onchange="setS()"><option value="1"'+(s.only?" selected":"")+'>Only from my material</option><option value="0"'+(s.only?"":" selected")+'>Allow general knowledge</option></select><button class="btn g" onclick="theme()">Switch dark or light</button></div>'+shareBox()+'<div class="box" style="--c:#e11d48"><b>Data</b><div class="row" style="margin-top:8px"><button class="btn g s" onclick="if(confirm(\'Clear mock history?\')){D.mocks=[];save();render()}">Clear mock history</button><button class="btn g s" onclick="if(confirm(\'Reset all progress?\')){D.log=[];D.mast=[];save();render()}">Reset progress</button></div></div>'}
function setS(){D.set={neg:+$("sn2").value,sec:+$("ss").value,goal:+$("sg").value,min:+$("sm").value,diff:$("sd").value,only:+$("so").value};save()}
function ai(){return '<h2 class="t">AI Assistant</h2><div class="box" style="--c:#7c3aed"><p>Ask Claude about your notes or pasted book text. Needs internet.</p><div class="mu">Source</div><select id="as"><option value="">None</option>'+D.notes.map(function(n){return '<option value="'+n.id+'">'+esc(n.title)+'</option>'}).join("")+'</select><textarea id="ax" placeholder="Or paste book text here"></textarea><textarea id="aq" style="min-height:80px" placeholder="Ask a question, or paste an MCQ with its options"></textarea><label class="mu" style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="checkbox" id="ao" style="width:auto;margin:0"'+(D.set.only?" checked":"")+'> Answer only from my material</label><button class="btn" onclick="askAI()">Ask</button></div><div class="card" id="ar" style="white-space:pre-wrap">The answer appears here.</div>'}
function askAI(){var q=$("aq").value.trim(),r=$("ar");if(!q){alert("Type a question first.");return}
if(!window.claude||!claude.use){r.textContent="AI is not available in this view.";return}
var n=D.notes.filter(function(x){return x.id===$("as").value})[0],src=($("ax").value+"\n"+(n?n.title+"\n"+n.body:"")).trim().slice(0,12000),only=$("ao").checked;r.textContent="Thinking...";
claude.use("sample").then(function(sm){if(!sm){r.textContent="AI is not available here.";return}
return sm("You are an MDCAT tutor. "+(src?"Study material:\n"+src+"\n\n":"No study material was given.\n\n")+(only?"Answer ONLY from the study material and say clearly if it is not covered.":"Prefer the study material, then general knowledge, and say which you used.")+" If the question is an MCQ, give the correct option, explain it, and explain why each other option is wrong. Name the chapter or page if the material shows it.\n\nQuestion:\n"+q,{cache:false,onText:function(o){r.textContent=o.text}})}).then(function(o){if(o&&o.text)r.textContent=o.text},function(e){r.textContent="Could not get an answer ("+(e&&e.code||"error")+")."})}
function net(){$("net").textContent=(navigator.onLine?"Online":"Offline")+(ADMIN?" · Owner":" · View")}
addEventListener("online",net);addEventListener("offline",net);net();load();go("home");
if(window.claude&&claude.use){claude.use("user").then(function(u){setAdmin(!!(u&&u.isOwner&&u.isOwner()))},function(){})}
</script><script>try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js")}catch(e){}</script></body></html>
